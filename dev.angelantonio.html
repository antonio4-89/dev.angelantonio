ta-canvas-height=\"5300\">\n\n  <!-- ============ CIELO PIXEL ART (fijo detrás del contenido) ============ -->\n  <div aria-hidden=\"true\" style=\"position: sticky; top: 0; height: 100vh; margin-bottom: -100vh; overflow: hidden; z-index: 0; background: #03050b\">\n    <div class=\"px-box\">\n      <div class=\"px clouds sc\"><\u002Fdiv>\n      <sc-if value=\"{{bolts}}\" hint-placeholder-val=\"{{ true }}\">\n        <div class=\"flash flash-amb\"><\u002Fdiv>\n        <div class=\"flash sc f1\"><\u002Fdiv>\n        <div class=\"flash sc f2\"><\u002Fdiv>\n        <div class=\"flash sc f3\"><\u002Fdiv>\n        <div class=\"flash sc f4\"><\u002Fdiv>\n        <div class=\"flash sc f5\"><\u002Fdiv>\n        <div class=\"flash sc f6\"><\u002Fdiv>\n        <div class=\"px bolts amb\"><\u002Fdiv>\n        <div class=\"px bolts sbolt k1 sc r1\"><\u002Fdiv>\n        <div class=\"px bolts sbolt k2 sc r2\"><\u002Fdiv>\n        <div class=\"px bolts sbolt k4 sc r3\"><\u002Fdiv>\n        <div class=\"px bolts sbolt k3 sc r4\"><\u002Fdiv>\n        <div class=\"px bolts sbolt k5 sc r5\"><\u002Fdiv>\n        <div class=\"px bolts sbolt k0 sc r6\"><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div class=\"veil sc\" style=\"position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(3,5,11,.35), rgba(3,5,11,.85)); opacity: .1\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ CONTENIDO ============ -->\n  <div style=\"position: relative; z-index: 1\">\n\n  <header style=\"position: relative; height: 900px; display: flex; flex-direction: column\">\n    <nav aria-label=\"Principal\" style=\"width: 100%; max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: 28px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px\">\n      <a href=\"#inicio\" style=\"display: flex; align-items: center; gap: 10px; text-decoration: none; color: #f2f7ff; font-family: 'Space Grotesk', sans-serif; font-weight: 600; ight: 1.75; color: #c3cfe0\">\n        <p style=\"margin: 0\">Soy desarrollador de software enfocado en aplicaciones web que optimizan procesos y mejoran la comunicación entre las personas que los usan.<\u002Fp>\n        <p style=\"margin: 0\">Me considero analítico, reflexivo y comprometido con la calidad. Me gusta entender a fondo lo que construyo, razonar cada decisión y anticipar errores antes de que lleguen al usuario.<\u002Fp>\n        <p style=\"margin: 0\">Fuera del código estoy cultivando el hábito de la lectura: aprender, cuestionar y ampliar la perspectiva es parte de cómo crezco, como profesional y como persona.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px\">\n          <span style=\"padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(169,207,255,.25); font-size: 14px; color: #dce8f8\">Analítico<\u002Fspan>\n          <span style=\"padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(169,207,255,.25); font-size: 14px; color: #dce8f8\">Reflexivo<\u002Fspan>\n          <span style=\"padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(169,207,255,.25); font-size: 14px; color: #dce8f8\">Orientado a la calidad<\u002Fspan>\n          <span style=\"padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(169,207,255,.25); font-size: 14px; color: #dce8f8\">Aprendizaje continuo<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n  <section style=\"max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: 100px 24px; display: flex; flex-direction: column; gap: 40px\">\n    <div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 760px\">\n      <p style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: .16em; color: #9cc9ff; text-shadow: 0 2px 12px #03050b\">02 — MI ENFOQUE<\u002Fp>\n      <h2 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; f
